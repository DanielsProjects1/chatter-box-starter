spring.application.name=Chatter_Box_Starter
server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/chatterbox
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/chatterbox/protocol/openid-connect/certs

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/chatterbox
spring.datasource.username=postgres
spring.datasource.password=unknownfuture23!
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect